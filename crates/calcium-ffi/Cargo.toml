[package]
name = "calcium-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C ABI for the Calcium engine"

[lib]
name = "calcium_ffi"
# staticlib for linking into an app bundle; rlib so the tests can run;
# cdylib so the wasm32 target emits a .wasm module for the web demo.
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
calcium-core = { path = "../calcium-core" }
