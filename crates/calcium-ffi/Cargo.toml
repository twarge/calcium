[package]
name = "calcium-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The C ABI ships inside the apps, not the registry.
publish = false
description = "C ABI for the Calcium engine"

[lib]
name = "calcium_ffi"
# staticlib for linking into an app bundle; rlib so the tests can run. NOT
# cdylib: that made native builds emit a .dylib as well, and `-l` prefers a
# dylib over a static library, so the apps started linking a Rust dylib the
# new linker rejects outright (mis-aligned LINKEDIT string pool). The wasm
# module comes from the calcium-wasm crate instead.
crate-type = ["staticlib", "rlib"]

[dependencies]
calcium-core = { path = "../calcium-core" }
