[workspace]
resolver = "2"
members = ["crates/calcium-core", "crates/calcium-cli", "crates/calcium-ffi", "crates/calcium-wasm"]

# A thin root package so the corpus test in tests/ can live beside the
# documents it reads.
[package]
name = "calcium"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
calcium-core = { path = "crates/calcium-core" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

# Dependencies compiled optimised even in a debug build. The engine leans on
# num-bigint and num-rational for every arithmetic step, and unoptimised they
# make a debug build eight times slower to evaluate a document — enough for the
# editor to feel it. Our own crates stay unoptimised and debuggable.
[profile.dev.package."*"]
opt-level = 2

# The web build: size first. Native release builds keep the default profile —
# this one is selected explicitly by build-web.sh.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
