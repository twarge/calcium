name: Calcium
options:
  bundleIdPrefix: com.twarge
  createIntermediateGroups: true

targets:
  Calcium:
    type: application
    # One target, both platforms. Shared Swift throughout; the AppKit editor
    # and window chrome are fenced with #if os(macOS), the UIKit editor with
    # #if os(iOS), and the Rust engine is linked per-SDK below.
    supportedDestinations: [macOS, iOS]
    deploymentTarget:
      macOS: "14.0"
      iOS: "17.0"
    sources:
      - path: Calcium/Sources
      # A folder reference, so the fonts land in Resources/Fonts/ — the path
      # ATSApplicationFontsPath (macOS) and UIAppFonts (iOS) both name.
      - path: Calcium/Resources/Fonts
        type: folder
      # The app icon: Fira Code's => ligature on calcium-flame orange,
      # regenerated by `swift apps/make-icon.swift`.
      - path: Calcium/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Calcium
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.calcium
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # XcodeGen's deploymentTarget block does not reach a
        # supportedDestinations target; without these the beta SDK's own
        # version becomes the floor and the app refuses older simulators.
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_HARDENED_RUNTIME: YES
        # Signing as set in Xcode's Signing & Capabilities and ported back
        # here — this file generates the project, so settings that live only
        # in the .xcodeproj are wiped by the next regeneration. Automatic
        # signing under the Twinleaf team everywhere; the simulator alone
        # runs unsigned. Entitlements (the App Sandbox) are macOS-only: iOS
        # is always sandboxed, and an unexpected entitlement would foul
        # device provisioning.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 257KW9ZJFP
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        "CODE_SIGNING_ALLOWED[sdk=macosx*]": YES
        "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": YES
        "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Calcium/Calcium.entitlements
        # Destinations as set in Xcode: no "Mac (Designed for iPad)" — the
        # Mac app is native — and allow the Vision Pro compatibility mode.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../crates/calcium-ffi/include"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../crates/calcium-ffi/include"
        # The Rust engine, one static library per SDK. Always the release
        # build: unoptimised it is six times slower and the editor feels it.
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": "$(SRCROOT)/../target/release"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../target/aarch64-apple-ios/release"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../target/universal-ios-sim/release"
        "OTHER_LDFLAGS[sdk=macosx*]": "-lcalcium_ffi -weak_framework FoundationModels"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "-lcalcium_ffi"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "-lcalcium_ffi"
    info:
      path: Calcium/Info.plist
      properties:
        CFBundleName: Calcium
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # Registers the bundled fonts: macOS reads the directory, iOS the list.
        ATSApplicationFontsPath: Fonts
        UIAppFonts:
          - Fonts/FiraCode-Regular.ttf
          - Fonts/FiraCode-Medium.ttf
          - Fonts/FiraCode-SemiBold.ttf
          - Fonts/FiraCode-Bold.ttf
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        # Multiple windows on iPad: one document per scene, side by side or
        # stacked, plus the system's own affordances (drag a document out of
        # the browser, the app switcher's +) and the app's ⌘N.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Every orientation, both devices: a text editor has no reason to
        # fight rotation, and iPad multitasking requires the full set anyway.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Calcium Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.twarge.calcium.document]
          # The same text format under another extension. Declared as an
          # alternate handler, not an owner: the identifier belongs to the app
          # that exports it, and this only asks to be offered as a choice.
          - CFBundleTypeName: Calca Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [io.calca.document]
        # Imported, not exported: this type is another application's to
        # declare. Repeating it here only lets this one open the files.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.calca.document
            UTTypeDescription: Calca Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [calca]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.twarge.calcium.document
            UTTypeDescription: Calcium Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [calcium]
    preBuildScripts:
      - name: Build Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          case "$PLATFORM_NAME" in
            iphoneos)        cargo build --release --target aarch64-apple-ios -p calcium-ffi ;;
            iphonesimulator)
              # Both simulator architectures, folded into one library — the
              # generic destination links x86_64 as well as arm64.
              cargo build --release --target aarch64-apple-ios-sim -p calcium-ffi
              cargo build --release --target x86_64-apple-ios -p calcium-ffi
              mkdir -p target/universal-ios-sim/release
              lipo -create \
                target/aarch64-apple-ios-sim/release/libcalcium_ffi.a \
                target/x86_64-apple-ios/release/libcalcium_ffi.a \
                -output target/universal-ios-sim/release/libcalcium_ffi.a
              ;;
            *)               cargo build --release -p calcium-ffi ;;
          esac
