name: Calcium
options:
  bundleIdPrefix: com.twarge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Calcium:
    type: application
    platform: macOS
    sources:
      - path: Calcium/Sources
      # A folder reference, so the fonts land in Resources/Fonts/ rather than
      # being flattened — that path is what ATSApplicationFontsPath names.
      - path: Calcium/Resources/Fonts
        type: folder
    settings:
      base:
        PRODUCT_NAME: Calcium
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.calcium
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # The Rust engine: a static library plus its C header, reached through
        # a module map so Swift can `import CalciumFFI`.
        # Always the release engine, even in a Debug app build. Unoptimised,
        # evaluating a document takes six times as long — enough for the editor
        # to feel it — and the Rust is exercised by `cargo test`, not by
        # stepping through it from Xcode. Swift stays debuggable either way.
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../target/release"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/../crates/calcium-ffi/include"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../crates/calcium-ffi/include"
        OTHER_LDFLAGS: "-lcalcium_ffi"
    info:
      path: Calcium/Info.plist
      properties:
        CFBundleName: Calcium
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # Registers the bundled fonts at launch; no code required.
        ATSApplicationFontsPath: Fonts
        CFBundleDocumentTypes:
          - CFBundleTypeName: Calcium Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.twarge.calcium.document]
          # The same text format under another extension. Declared as an
          # alternate handler, not an owner: the identifier belongs to the app
          # that exports it, and this only asks to be offered as a choice.
          - CFBundleTypeName: Calca Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [io.calca.document]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        # Imported, not exported: this type is another application's to
        # declare. Repeating it here only lets this one open the files.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.calca.document
            UTTypeDescription: Calca Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [calca]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.twarge.calcium.document
            UTTypeDescription: Calcium Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [calcium]
    preBuildScripts:
      - name: Build Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          cargo build --release -p calcium-ffi
